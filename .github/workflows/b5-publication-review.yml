name: B5 publication review (not a release)

'on':
  # Publish review-only artifacts for the audit PR, never on main itself.
  # Avoid duplicate expensive TeX builds from both push and PR events.
  pull_request:
    branches:
      - main
    paths:
      - 'paper/**'
      - 'scripts/71_refresh_presentation.py'
      - 'scripts/72_verify_publication.py'
      - 'scripts/73_build_b5_artifacts.py'
      - 'tables/final_full_multiseed_summary.csv'
      - 'requirements-publishing.txt'
      - 'docs/audit/b5_release_gates_2026-11-17.json'
      - '.github/workflows/b5-publication-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source/table consistency without large datasets
        run: python scripts/72_verify_publication.py

      - name: B5 source-consistency regression tests
        run: python -m unittest discover -s tests -p "test_b5_publication.py" -v

      - name: Verify release is still blocked (expected)
        run: |
          if python scripts/72_verify_publication.py --release; then
            echo 'ERROR: release unexpectedly approved'
            exit 1
          fi
          echo 'Release gate appropriately blocks premature release.'

  build-review:
    runs-on: ubuntu-latest
    needs: source-consistency
    timeout-minutes: 45
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install B5 publication dependencies
        run: |
          python -m pip install -r requirements-publishing.txt
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            latexmk texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-science texlive-fonts-recommended lmodern

      - name: Build audited review PDF and PPTX
        run: python scripts/73_build_b5_artifacts.py --output-dir dist/b5

      - name: Verify regenerated deck and paper values
        run: python scripts/72_verify_publication.py --deck dist/b5/sc2_outcome_prediction_presentation_B5_REVIEW.pptx

      - name: Archive B5 review exports (not original release binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b5-audited-review-pdf-pptx
          if-no-files-found: warn
          path: |
            dist/b5/*_B5_REVIEW.pdf
            dist/b5/*_B5_REVIEW.pptx
            dist/b5/b5_build_manifest.json
